<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Healthcare Cloud Solutions Icon -->
  <g transform="translate(50, 50) scale(0.75)">
    <!-- Cloud Shape -->
    <path d="M320 180 C360 180 400 210 400 260 C400 310 360 340 320 340 H120 C80 340 40 310 40 260 C40 220 70 180 110 180 C110 120 160 80 220 80 C280 80 320 130 320 180 Z" fill="#ECEFF1" stroke="#000" stroke-width="10"/>
    
    <!-- Medical Cross -->
    <rect x="180" y="140" width="80" height="140" rx="10" fill="#6366F1"/>
    <rect x="150" y="170" width="140" height="80" rx="10" fill="#6366F1"/>
    
    <!-- Database/Storage Symbol -->
    <ellipse cx="120" cy="240" rx="40" ry="20" fill="#78909C"/>
    <path d="M80 240 V280 C80 290 100 300 120 300 C140 300 160 290 160 280 V240" stroke="#78909C" stroke-width="10" fill="#78909C"/>
    <ellipse cx="120" cy="280" rx="40" ry="20" fill="#78909C"/>
    
    <!-- Server/Computing Symbol -->
    <rect x="280" y="220" width="60" height="80" rx="5" fill="#78909C"/>
    <line x1="290" y1="240" x2="330" y2="240" stroke="white" stroke-width="5"/>
    <line x1="290" y1="260" x2="330" y2="260" stroke="white" stroke-width="5"/>
    <line x1="290" y1="280" x2="330" y2="280" stroke="white" stroke-width="5"/>
  </g>
</svg>
