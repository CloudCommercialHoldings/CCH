<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Clinical Data Validation & Improper Payments Icon -->
  <g transform="translate(40, 40) scale(0.8)">
    <!-- Chart/Graph Base -->
    <rect x="50" y="80" width="300" height="200" rx="10" stroke="#000" stroke-width="12" fill="white"/>
    
    <!-- Graph Line with Error/Anomaly Point -->
    <path d="M80 220 L140 180 L200 190 L240 120 L280 220 L320 190" stroke="#000" stroke-width="8" fill="none"/>
    
    <!-- Error/Anomaly Point -->
    <circle cx="240" cy="120" r="18" fill="#FF5252"/>
    <path d="M232 112 L248 128 M248 112 L232 128" stroke="white" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Checkmark for Validation -->
    <circle cx="320" cy="100" r="40" fill="#4CAF50"/>
    <path d="M300 100 L315 120 L340 80" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Dollar Sign for Payment -->
    <circle cx="80" cy="100" r="40" fill="#FFC107"/>
    <path d="M80 80 L80 120 M70 85 C70 85 80 75 90 85 C100 95 90 105 80 105 C70 105 60 115 70 125 C80 135 90 125 90 125" stroke="white" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
