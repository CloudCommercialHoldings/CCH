<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Telehealth Infrastructure Icon -->
  <g transform="translate(50, 50) scale(0.75)">
    <!-- Video Conference Screen -->
    <rect x="50" y="80" width="240" height="160" rx="10" stroke="#000" stroke-width="10" fill="#E1F5FE"/>
    
    <!-- Doctor on Screen -->
    <circle cx="120" cy="140" r="40" fill="#90CAF9"/>
    <path d="M120 160 V240" stroke="#90CAF9" stroke-width="20" stroke-linecap="round"/>
    <path d="M90 180 L150 180" stroke="#90CAF9" stroke-width="15" stroke-linecap="round"/>
    
    <!-- Medical Cross -->
    <rect x="210" y="120" width="20" height="60" rx="5" fill="#6366F1"/>
    <rect x="190" y="140" width="60" height="20" rx="5" fill="#6366F1"/>
    
    <!-- Network/Infrastructure -->
    <path d="M170 240 L170 300 L50 300 M170 300 L290 300" stroke="#000" stroke-width="10" fill="none"/>
    <rect x="30" y="280" width="40" height="40" rx="5" stroke="#000" stroke-width="5" fill="#9E9E9E"/>
    <rect x="150" y="280" width="40" height="40" rx="5" stroke="#000" stroke-width="5" fill="#9E9E9E"/>
    <rect x="270" y="280" width="40" height="40" rx="5" stroke="#000" stroke-width="5" fill="#9E9E9E"/>
    
    <!-- Vital Signs -->
    <path d="M310 80 L310 100 L330 120 L350 90 L370 130 L390 110 L390 80 Z" stroke="#FF5252" stroke-width="5" fill="none"/>
  </g>
</svg>
