<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- AI icon with neural network and circuit elements -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="4"/>
  
  <!-- Brain outline -->
  <path d="M35,35 C30,35 25,40 25,45 C25,50 30,55 35,55 L35,65 C35,70 40,75 45,75 L55,75 C60,75 65,70 65,65 L65,55 C70,55 75,50 75,45 C75,40 70,35 65,35 L35,35 Z" fill="none" stroke="currentColor" stroke-width="2.5"/>
  
  <!-- Neural network nodes -->
  <circle cx="35" cy="45" r="4" fill="currentColor"/>
  <circle cx="50" cy="35" r="4" fill="currentColor"/>
  <circle cx="65" cy="45" r="4" fill="currentColor"/>
  <circle cx="40" cy="60" r="4" fill="currentColor"/>
  <circle cx="60" cy="60" r="4" fill="currentColor"/>
  <circle cx="50" cy="75" r="4" fill="currentColor"/>
  
  <!-- Connection lines -->
  <path d="M35,45 L50,35 L65,45 M35,45 L40,60 M65,45 L60,60 M40,60 L50,75 L60,60 M50,35 L50,30 M50,75 L50,80" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Circuit patterns -->
  <path d="M30,40 L25,40 L25,30 L30,30 M70,40 L75,40 L75,30 L70,30" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Binary elements -->
  <text x="30" y="32" font-family="monospace" font-size="8" fill="currentColor">10</text>
  <text x="65" y="32" font-family="monospace" font-size="8" fill="currentColor">01</text>
</svg>
