---
layout: default
---
<main class="post-main section" style="padding-top: 120px; max-width: 800px; margin: 0 auto;">
    <article class="container">
        <header style="margin-bottom: 2rem;">
            <h1>{{ page.title }}</h1>
            <p style="color: #666;">
                By {{ page.author }} on {{ page.date | date: "%B %d, %Y" }}
            </p>
        </header>
        <div class="post-content">
            {{ content }}
        </div>
        <div style="margin-top: 3rem;">
            <a href="{{ '/blog' | relative_url }}" class="cta-pill" style="display:inline-block;">&larr; Back to Blog</a>
        </div>
    </article>
</main>
