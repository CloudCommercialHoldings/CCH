<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- FHIR Standards Analysis and Development Icon -->
  <g transform="translate(40, 40) scale(0.8)">
    <!-- FHIR Logo Base -->
    <path d="M80 80 H320 A40 40 0 0 1 320 160 H80 A40 40 0 0 1 80 80 Z" fill="#1565C0"/>
    <text x="200" y="130" font-family="Arial" font-size="50" font-weight="bold" text-anchor="middle" fill="white">FHIR</text>
    
    <!-- Interoperability/Data Exchange Symbols -->
    <path d="M160 200 L80 280 M160 280 L80 200" stroke="#000" stroke-width="10" stroke-linecap="round"/>
    <circle cx="80" cy="200" r="20" fill="#4CAF50"/>
    <circle cx="160" cy="200" r="20" fill="#4CAF50"/>
    <circle cx="80" cy="280" r="20" fill="#4CAF50"/>
    <circle cx="160" cy="280" r="20" fill="#4CAF50"/>
    
    <!-- API/Integration Symbol -->
    <path d="M240 200 H320 M280 160 V240" stroke="#000" stroke-width="10" stroke-linecap="round"/>
    <circle cx="240" cy="200" r="20" fill="#FF9800"/>
    <circle cx="320" cy="200" r="20" fill="#FF9800"/>
    <circle cx="280" cy="160" r="20" fill="#FF9800"/>
    <circle cx="280" cy="240" r="20" fill="#FF9800"/>
  </g>
</svg>
